[package]
name = "rust_verification"
version = "0.1.0"
edition = "2021"
authors = ["Gemini (Implementer / System Operator)"]
description = "CR8818 Rust Strategy Verification: WireGuard Packet Parsing, UAPI Protocol, Motorcomm Tag Fuzzing & Telemetry"

[dependencies]

[[bin]]
name = "rust_verification_cli"
path = "src/main.rs"

[lib]
name = "rust_verification"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
